<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Generator | myselfsundaresan</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

    <style>
        /* ═══════════════════════════════════════════════
           ULTRA-PREMIUM TOKENS (DARK MODE DEFAULT)
        ═══════════════════════════════════════════════ */
        :root {
            /* Core Colors */
            --accent: #E07828;
            --accent-light: #F09444;
            --accent-alpha: rgba(224, 120, 40, 0.15);
            
            /* Dark Theme Default */
            --bg-base: #020305;
            --text-primary: #f5f6f8;
            --text-secondary: #a1a8b5;
            --text-muted: #606675;
            
            /* Dark Material Glass */
            --glass-bg: rgba(15, 17, 23, 0.4);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-highlight: rgba(255, 255, 255, 0.12);
            --glass-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.6), 
                inset 0 1px 1px rgba(255, 255, 255, 0.15),
                inset 0 -1px 1px rgba(0, 0, 0, 0.5),
                inset 1px 0 1px rgba(255, 255, 255, 0.05);
                
            /* Dark Auroras */
            --orb-1: rgba(224, 120, 40, 0.12);
            --orb-2: rgba(60, 40, 160, 0.15);
            --orb-3: rgba(180, 70, 40, 0.1);

            /* Physics / Easing */
            --ease-fluid: cubic-bezier(0.2, 0, 0, 1);
            --ease-spring: cubic-bezier(0.25, 1.2, 0.3, 1);
            --ease-material: cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100vh; /* Fixed height */
            overflow: hidden; /* Prevent body scroll */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ═══════════════════════════════════════════════
           AMBIENT ENGINE
        ═══════════════════════════════════════════════ */
        .ambient-container { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
        .orb { 
            position: absolute; border-radius: 50%; opacity: 0.9;
            will-change: transform; transform: translate3d(0, 0, 0);
            transition: transform 0.8s var(--ease-fluid);
        }
        .orb-1 { top: -20%; left: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, var(--orb-1) 0%, transparent 60%); }
        .orb-2 { bottom: -20%; right: -20%; width: 70vw; height: 70vw; background: radial-gradient(circle, var(--orb-2) 0%, transparent 60%); }
        .orb-3 { top: 30%; left: 30%; width: 50vw; height: 50vw; background: radial-gradient(circle, var(--orb-3) 0%, transparent 60%); }

        /* ═══════════════════════════════════════════════
           ULTRA-GLASS COMPONENTS
        ═══════════════════════════════════════════════ */
        .ultra-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            isolation: isolate; 
            position: relative; overflow: hidden;
        }

        /* Dynamic Hover Glare */
        .ultra-glass::after {
            content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
            background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.06), transparent 40%);
            opacity: 0; transition: opacity 0.4s var(--ease-material);
        }
        .ultra-glass:hover::after { opacity: 1; }

        /* ═══════════════════════════════════════════════
           MATERIAL BUTTONS
        ═══════════════════════════════════════════════ */
        .btn-primary { 
            background: var(--accent); color: #fff; 
            box-shadow: 0 12px 30px -8px rgba(224, 120, 40, 0.5), inset 0 2px 0 0 rgba(255,255,255,0.2); 
            border-radius: 100px; font-weight: 600;
            transition: all 0.3s var(--ease-material);
        }
        .btn-primary:hover { 
            background: var(--accent-light); 
            box-shadow: 0 20px 40px -10px rgba(224, 120, 40, 0.7), inset 0 2px 0 0 rgba(255,255,255,0.3); 
            transform: translateY(-2px);
        }
        .btn-primary:active { transform: scale(0.96); }

        .btn-glass { 
            border: 1px solid var(--glass-border); color: var(--text-primary); 
            background: rgba(255,255,255,0.02); backdrop-filter: blur(10px);
            border-radius: 100px; font-weight: 600;
            transition: all 0.3s var(--ease-material);
        }
        .btn-glass:hover { 
            background: rgba(255,255,255,0.1); border-color: var(--glass-highlight); 
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); transform: translateY(-2px);
        }
        .btn-glass:active { transform: scale(0.96); }

        .btn-danger { color: #ef4444; transition: color 0.2s; }
        .btn-danger:hover { color: #f87171; }

        /* ═══════════════════════════════════════════════
           INPUTS & TABLES
        ═══════════════════════════════════════════════ */
        .input-glass {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            transition: all 0.3s ease;
            border-radius: 0.5rem;
        }
        .input-glass:focus {
            outline: none; border-color: var(--accent);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 0 2px var(--accent-alpha);
        }

        /* Hide Input Arrows */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* Tables */
        .table-header {
            background-color: rgba(0,0,0,0.3);
            color: var(--text-muted); text-transform: uppercase;
            font-size: 0.70rem; letter-spacing: 0.05em; font-family: 'JetBrains Mono', monospace;
        }
        .table-row { border-bottom: 1px solid var(--glass-border); transition: background-color 0.2s; }
        .table-row:hover { background-color: rgba(255,255,255,0.03); }

        /* Tabs */
        .tab-btn {
            border-bottom: 2px solid transparent; color: var(--text-muted); transition: all 0.3s ease;
        }
        .tab-btn:hover { color: var(--text-primary); }
        .tab-btn.active { border-bottom-color: var(--accent); color: var(--text-primary); }

        /* Verification Panel Collapsible Logic */
        #verification-panel { max-height: 56px; transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        #verification-panel:hover, #verification-panel.expanded { max-height: 40%; }

        /* Toast */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 50; }
        .toast {
            background: rgba(15, 17, 23, 0.9); backdrop-filter: blur(10px);
            border: 1px solid var(--accent); color: var(--text-primary);
            padding: 12px 20px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(100px); opacity: 0; transition: all 0.4s var(--ease-spring);
            display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 0.9rem;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="p-2 md:p-3 flex flex-col box-border">

    <!-- Ambient Background -->
    <div class="ambient-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div id="toast-container"></div>

    <div class="relative z-10 w-full max-w-[1400px] mx-auto flex flex-col h-full gap-4">
        
        <!-- Header -->
        <header class="shrink-0 flex flex-col md:flex-row justify-between items-center ultra-glass px-6 py-4 rounded-[2rem]">
            <div class="relative z-10 mb-3 md:mb-0">
                <a href="https://myselfsundaresan.github.io/" class="text-[var(--accent)] font-mono text-[10px] font-bold uppercase tracking-[0.2em] flex items-center gap-1 mb-1 hover:text-[var(--accent-light)] transition-colors">
                    <span class="material-symbols-outlined text-xs">arrow_back</span>
                    Back to Portfolio
                </a>
                <h1 class="text-2xl font-bold mb-0 flex items-center gap-2 font-serif text-[1.8rem]">
                    <span class="material-symbols-outlined text-[var(--accent)] text-[2rem]">database</span>
                    <span>Dataset <span class="text-[var(--accent)] italic">Generator</span></span>
                </h1>
                <p class="text-[var(--text-muted)] text-sm">Synthesize raw statistical data models with precision.</p>
            </div>
            
            <div class="relative z-10 flex flex-wrap gap-3 justify-center items-center">
                <button onclick="addVariable()" class="btn-glass px-4 py-2 text-xs flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-sm">add</span> Variable
                </button>
                <button onclick="addGroup()" class="btn-glass px-4 py-2 text-xs flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-sm">group_add</span> Group
                </button>
                <button onclick="resetDefaults()" class="text-[var(--text-muted)] hover:text-[var(--text-primary)] text-xs underline px-2 transition-colors ml-2">
                    Reset
                </button>
            </div>
        </header>

        <div class="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-12 gap-4">
            
            <!-- Left Config Panel -->
            <div class="lg:col-span-4 ultra-glass rounded-[2rem] flex flex-col h-full overflow-hidden interactive-card">
                <div class="px-6 py-4 border-b border-[var(--glass-border)] flex justify-between items-center shrink-0">
                    <h2 class="text-lg font-bold flex items-center gap-2">
                        <span class="material-symbols-outlined text-[var(--accent)] text-xl">tune</span>
                        Configuration
                    </h2>
                    <span class="text-[10px] font-mono bg-[var(--accent-alpha)] text-[var(--accent)] px-2 py-0.5 rounded-full border border-[rgba(224,120,40,0.3)]">Auto-Update</span>
                </div>
                
                <div id="config-container" class="flex-1 overflow-y-auto p-5 space-y-5">
                    <!-- Groups populated here by JS -->
                </div>

                <div class="px-6 py-4 border-t border-[var(--glass-border)] shrink-0 bg-black/20">
                    <button onclick="generateData()" class="btn-primary w-full py-3 text-sm flex justify-center items-center gap-2">
                        <span class="material-symbols-outlined text-lg">refresh</span> 
                        Regenerate Dataset
                    </button>
                </div>
            </div>

            <!-- Right Results Panel -->
            <div id="results-panel" class="lg:col-span-8 flex flex-col gap-4 h-full min-h-0 hidden">
                
                <!-- Verification Panel -->
                <div id="verification-panel" class="ultra-glass rounded-[2rem] overflow-hidden shrink-0 flex flex-col group interactive-card">
                    <div class="px-6 py-4 border-b border-[var(--glass-border)] shrink-0 flex justify-between items-center cursor-default bg-black/20">
                        <h2 class="text-lg font-bold flex items-center gap-2">
                            <span class="material-symbols-outlined text-green-500 text-xl">verified</span>
                            Verification Engine
                        </h2>
                        <span class="text-xs text-[var(--text-muted)] group-hover:text-[var(--accent)] transition-colors opacity-100 group-[.expanded]:opacity-0 font-mono tracking-widest uppercase">Hover to Expand</span>
                    </div>
                    <div class="overflow-auto flex-1">
                        <table class="w-full text-xs text-left">
                            <thead class="table-header sticky top-0 z-10 backdrop-blur-md">
                                <tr>
                                    <th class="px-5 py-3">Group</th>
                                    <th class="px-5 py-3">Variable</th>
                                    <th class="px-5 py-3 text-right">Target</th>
                                    <th class="px-5 py-3 text-right">Generated</th>
                                    <th class="px-5 py-3 text-center">Status</th>
                                </tr>
                            </thead>
                            <tbody id="stats-table-body" class="divide-y divide-[var(--glass-border)] text-[var(--text-secondary)]">
                                <!-- Stats injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Raw Data Panel -->
                <div class="ultra-glass rounded-[2rem] flex flex-col flex-1 min-h-0 overflow-hidden interactive-card">
                    <div class="px-6 py-4 border-b border-[var(--glass-border)] flex justify-between items-center shrink-0 bg-black/20">
                        <div class="flex items-center gap-3">
                            <h2 class="text-lg font-bold flex items-center gap-2">
                                <span class="material-symbols-outlined text-[var(--accent-light)] text-xl">table_view</span>
                                Raw Data
                            </h2>
                            <span class="text-[10px] font-mono bg-white/5 text-[var(--text-primary)] px-2 py-0.5 rounded-full border border-white/10">Total N=<span id="total-n">30</span></span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="downloadJSON()" class="btn-glass px-3 py-1.5 text-xs flex items-center gap-1.5" style="padding: 0.4rem 1rem;">
                                <span class="material-symbols-outlined text-sm">code</span> JSON
                            </button>
                            <button onclick="downloadCSV()" class="btn-primary px-3 py-1.5 text-xs flex items-center gap-1.5" style="padding: 0.4rem 1rem;">
                                <span class="material-symbols-outlined text-sm">download</span> CSV
                            </button>
                        </div>
                    </div>
                    
                    <div class="px-6 pt-2 border-b border-[var(--glass-border)] flex gap-5 overflow-x-auto shrink-0 bg-black/10" id="tabs-container">
                        <!-- Tabs injected here -->
                    </div>

                    <div class="flex-1 overflow-auto">
                        <table class="w-full text-xs text-left border-collapse">
                            <thead class="table-header sticky top-0 z-10 backdrop-blur-md">
                                <tr id="data-table-header">
                                    <!-- Headers injected here -->
                                </tr>
                            </thead>
                            <tbody id="data-table-body" class="divide-y divide-[var(--glass-border)] text-[var(--text-secondary)]">
                                <!-- Data injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const initialGroups = [
            {
                id: 'g1',
                name: "Group 1",
                n: 10,
                variables: {
                    "Variable 1": { mean: 0, sd: 0, allowNegative: true } 
                }
            }
        ];

        let state = {
            groups: JSON.parse(JSON.stringify(initialGroups)),
            activeTabIndex: 0,
            generatedData: []
        };

        // --- Glare Effect Logic ---
        document.addEventListener('mousemove', (e) => {
            document.querySelectorAll('.interactive-card').forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mx', `${x}px`);
                card.style.setProperty('--my', `${y}px`);
            });
        });

        // --- Core Algorithm ---
        function randomNormal() {
            let u = 0, v = 0;
            while(u === 0) u = Math.random();
            while(v === 0) v = Math.random();
            return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        }

        function generateExactData(n, targetMean, targetSd, allowNegative = true) {
            if (n < 2) {
                let val = targetMean;
                if (!allowNegative && val < 0) val = 0;
                return Array(n).fill(val); 
            }
            
            let data = Array.from({ length: n }, () => randomNormal());
            
            const currentMean = data.reduce((a, b) => a + b, 0) / n;
            const currentVariance = data.reduce((a, b) => a + Math.pow(b - currentMean, 2), 0) / (n - 1);
            const currentSd = Math.sqrt(currentVariance);

            let transformedData = data.map(x => {
                if(currentSd === 0) return targetMean; 
                return ((x - currentMean) / currentSd) * targetSd + targetMean;
            });

            if (!allowNegative) {
                transformedData = transformedData.map(x => Math.max(0, x));
            }

            return transformedData;
        }

        // --- Controller Functions ---
        function addVariable() {
            const varName = prompt("Enter new variable name (e.g., Age, BMI):");
            if (!varName) return;
            
            if (state.groups.length > 0 && state.groups[0].variables[varName]) {
                alert("Variable name already exists.");
                return;
            }

            state.groups.forEach(group => {
                if (!group.variables[varName]) {
                    group.variables[varName] = { mean: 0, sd: 0, allowNegative: true };
                }
            });
            refreshUI();
        }

        function renameVariable(oldName, newName) {
            if (newName === undefined) {
                newName = prompt("Enter new variable name:", oldName);
            }
            
            if (!newName || newName === oldName) {
                refreshUI();
                return;
            }

            if (state.groups.length > 0 && state.groups[0].variables[newName]) {
                alert("Variable name already exists.");
                refreshUI();
                return;
            }

            state.groups.forEach(group => {
                const newVariables = {};
                Object.keys(group.variables).forEach(key => {
                    if (key === oldName) {
                        newVariables[newName] = group.variables[oldName];
                    } else {
                        newVariables[key] = group.variables[key];
                    }
                });
                group.variables = newVariables;
            });
            refreshUI();
        }

        function renameGroup(groupIndex) {
            const oldName = state.groups[groupIndex].name;
            const newName = prompt("Enter new Group name:", oldName);
            
            if (newName && newName !== oldName) {
                state.groups[groupIndex].name = newName;
                generateData(); 
            }
        }

        function removeVariable(varName) {
            if (!confirm(`Delete variable "${varName}" from all groups?`)) return;
            state.groups.forEach(group => {
                delete group.variables[varName];
            });
            refreshUI();
        }

        function addGroup() {
            const groupName = prompt("Enter new Group name:");
            if (!groupName) return;
            
            const firstGroupVars = state.groups.length > 0 ? Object.keys(state.groups[0].variables) : ['Variable 1'];
            const newVariables = {};
            
            firstGroupVars.forEach(v => {
                newVariables[v] = { mean: 0, sd: 0, allowNegative: true };
            });

            state.groups.push({
                id: 'g_' + Date.now(),
                name: groupName,
                n: 10,
                variables: newVariables
            });
            refreshUI();
        }

        function removeGroup(index) {
            if (state.groups.length <= 1) {
                alert("You must have at least one group.");
                return;
            }
            if (!confirm("Remove this group?")) return;
            state.groups.splice(index, 1);
            if (state.activeTabIndex >= state.groups.length) {
                state.activeTabIndex = Math.max(0, state.groups.length - 1);
            }
            refreshUI();
        }

        function updateConfig(groupIndex, varName, field, value) {
            if (field === 'allowNegative') {
                state.groups[groupIndex].variables[varName][field] = value;
            } else {
                state.groups[groupIndex].variables[varName][field] = parseFloat(value) || 0;
            }
        }

        function updateGroupN(groupIndex, value) {
            const n = parseInt(value);
            if (n > 0) {
                state.groups[groupIndex].n = n;
            }
        }

        function resetDefaults() {
            if(confirm("Reset to default configuration?")) {
                state.groups = JSON.parse(JSON.stringify(initialGroups));
                state.activeTabIndex = 0;
                renderConfig();
                document.getElementById('results-panel').classList.add('hidden');
                state.generatedData = [];
            }
        }

        function refreshUI() {
            renderConfig();
            generateData();
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span class="material-symbols-outlined text-[var(--accent)]">check_circle</span> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => container.removeChild(toast), 400);
            }, 2500);
        }

        function copyColumn(varName) {
            if (!state.generatedData.length || !state.groups[state.activeTabIndex]) return;
            
            const activeGroupName = state.groups[state.activeTabIndex].name;
            const rows = state.generatedData.filter(r => r.group === activeGroupName);
            
            if (rows.length === 0) return;

            const values = rows.map(r => r[varName].toFixed(3)).join('\n');
            
            navigator.clipboard.writeText(values).then(() => {
                showToast(`Copied values for <strong>${varName}</strong>`);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert('Failed to copy to clipboard.');
            });
        }

        function switchTab(index) {
            state.activeTabIndex = index;
            renderTabs();
            const allVarNames = state.groups.length > 0 ? Object.keys(state.groups[0].variables) : [];
            renderTable(allVarNames);
        }

        // --- Auto Expand Logic ---
        let expandTimeout;
        function triggerVerificationExpand() {
            const panel = document.getElementById('verification-panel');
            if (!panel) return;
            
            panel.classList.add('expanded');
            
            if (expandTimeout) clearTimeout(expandTimeout);
            
            expandTimeout = setTimeout(() => {
                panel.classList.remove('expanded');
            }, 3000); 
        }

        // --- Rendering ---

        function renderConfig() {
            const container = document.getElementById('config-container');
            container.innerHTML = '';

            state.groups.forEach((group, groupIndex) => {
                const groupEl = document.createElement('div');
                groupEl.className = 'bg-[rgba(255,255,255,0.02)] rounded-xl p-5 border border-[var(--glass-border)] relative group hover:border-[rgba(224,120,40,0.4)] transition-colors duration-300 shadow-inner shadow-white/5';
                
                let varsHtml = '';
                const varKeys = Object.keys(group.variables);

                const deleteBtn = `
                    <button onclick="removeGroup(${groupIndex})" class="text-red-400 hover:text-red-300 absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity" title="Remove Group">
                        <span class="material-symbols-outlined text-base">delete</span>
                    </button>
                `;
                
                varKeys.forEach(varName => {
                    varsHtml += `
                        <div class="mt-4 pb-4 border-b border-[var(--glass-border)] last:border-0 last:pb-0 relative">
                            <div class="flex justify-between items-center mb-2">
                                <div class="flex items-center gap-1.5 flex-grow">
                                    <span class="font-mono text-[11px] font-bold text-[var(--accent)] uppercase tracking-widest px-1">${varName}</span>
                                    ${groupIndex === 0 
                                        ? `<button onclick="renameVariable('${varName}')" class="text-xs text-[var(--text-muted)] hover:text-[var(--text-primary)] transition-colors" title="Rename Variable"><span class="material-symbols-outlined text-xs">edit</span></button>`
                                        : ''
                                    }
                                </div>
                                ${groupIndex === 0 ? `<button onclick="removeVariable('${varName}')" class="text-xs text-red-500/50 hover:text-red-400 transition-colors ml-2" title="Delete Variable from All Groups"><span class="material-symbols-outlined text-xs">close</span></button>` : ''}
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="relative">
                                    <span class="absolute left-3 top-2 text-[9px] text-[var(--text-muted)] font-mono tracking-widest">MEAN</span>
                                    <input type="number" step="0.01" value="${group.variables[varName].mean}" 
                                        onchange="updateConfig(${groupIndex}, '${varName}', 'mean', this.value)"
                                        class="input-glass w-full text-sm pl-3 pt-5 pb-1.5 font-mono">
                                </div>
                                <div class="relative">
                                    <span class="absolute left-3 top-2 text-[9px] text-[var(--text-muted)] font-mono tracking-widest">SD</span>
                                    <input type="number" step="0.001" value="${group.variables[varName].sd}" 
                                        onchange="updateConfig(${groupIndex}, '${varName}', 'sd', this.value)"
                                        class="input-glass w-full text-sm pl-3 pt-5 pb-1.5 font-mono">
                                </div>
                            </div>
                            <div class="mt-3 flex items-center justify-end">
                                <label class="flex items-center gap-2 cursor-pointer group/toggle">
                                    <input type="checkbox" 
                                        ${group.variables[varName].allowNegative !== false ? 'checked' : ''} 
                                        onchange="updateConfig(${groupIndex}, '${varName}', 'allowNegative', this.checked)"
                                        class="accent-[var(--accent)] w-3.5 h-3.5 cursor-pointer">
                                    <span class="text-[11px] text-[var(--text-muted)] font-medium group-hover/toggle:text-[var(--text-primary)] transition-colors">Allow Negatives</span>
                                </label>
                            </div>
                        </div>
                    `;
                });

                groupEl.innerHTML = `
                    ${deleteBtn}
                    <div class="mb-4 pr-8">
                        <label class="block text-[9px] font-mono text-[var(--text-muted)] mb-1 tracking-widest">GROUP</label>
                        <div class="flex items-center gap-2 mb-3">
                            <span class="font-bold text-[var(--text-primary)] text-lg w-full truncate border-b border-transparent hover:border-gray-500 transition-colors py-0.5 cursor-pointer" onclick="renameGroup(${groupIndex})">${group.name}</span>
                            <button onclick="renameGroup(${groupIndex})" class="text-xs text-[var(--text-muted)] hover:text-white shrink-0" title="Rename Group"><span class="material-symbols-outlined text-sm">edit</span></button>
                        </div>
                        <div class="flex items-center text-xs text-[var(--text-muted)] bg-black/30 rounded p-1.5 w-fit border border-[var(--glass-border)]">
                            <span class="mr-2 font-mono font-bold tracking-wider">N =</span>
                            <input type="number" min="2" value="${group.n}" onchange="updateGroupN(${groupIndex}, this.value)" 
                                class="w-12 px-1 py-0.5 bg-white/5 border border-[var(--glass-border)] rounded text-center text-[var(--text-primary)] focus:outline-none focus:border-[var(--accent)] transition-colors font-mono">
                        </div>
                    </div>
                    ${varsHtml}
                `;
                container.appendChild(groupEl);
            });
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            
            state.groups.forEach((group, index) => {
                const btn = document.createElement('button');
                const isActive = index === state.activeTabIndex;
                btn.className = `tab-btn px-5 py-2.5 text-sm font-bold whitespace-nowrap ${isActive ? 'active' : ''}`;
                btn.textContent = group.name;
                btn.onclick = () => switchTab(index);
                container.appendChild(btn);
            });
        }

        function calculateActualStats(arr) {
            const n = arr.length;
            if (n === 0) return { mean: 0, sd: 0 };
            const mean = arr.reduce((a, b) => a + b, 0) / n;
            const variance = arr.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1);
            return { mean, sd: Math.sqrt(variance) };
        }

        function generateData() {
            state.generatedData = [];
            let totalN = 0;
            const allVarNames = state.groups.length > 0 ? Object.keys(state.groups[0].variables) : [];

            state.groups.forEach((group) => {
                totalN += group.n;
                const groupData = {}; 
                
                allVarNames.forEach(varName => {
                    const params = group.variables[varName];
                    if(params) {
                        const allowNeg = params.allowNegative !== false; 
                        groupData[varName] = generateExactData(group.n, params.mean, params.sd, allowNeg);
                    } else {
                        groupData[varName] = Array(group.n).fill(0);
                    }
                });

                for (let i = 0; i < group.n; i++) {
                    const row = {
                        id: `${group.name.substring(0, 3).toUpperCase().replace(/[^A-Z]/g, '')}_${i + 1}`,
                        group: group.name
                    };
                    allVarNames.forEach(varName => {
                        row[varName] = groupData[varName][i];
                    });
                    state.generatedData.push(row);
                }
            });

            document.getElementById('total-n').textContent = totalN;
            
            document.getElementById('results-panel').classList.remove('hidden');
            
            renderTabs();
            renderTable(allVarNames);
            renderStatsVerification(allVarNames);
            
            triggerVerificationExpand();
        }

        function renderTable(varNames) {
            const thead = document.getElementById('data-table-header');
            const tbody = document.getElementById('data-table-body');
            
            let headerHtml = `
                <th class="px-5 py-3">ID</th>
                <th class="px-5 py-3">Group</th> 
            `;
            varNames.forEach(v => {
                headerHtml += `
                    <th class="px-5 py-3 text-right group cursor-pointer hover:text-[var(--text-primary)] transition-colors" onclick="copyColumn('${v}')" title="Click to copy all ${v} values">
                        <div class="flex items-center justify-end gap-1.5">
                            ${v}
                            <span class="material-symbols-outlined text-[12px] opacity-0 group-hover:opacity-100 transition-opacity text-[var(--accent)]">content_copy</span>
                        </div>
                    </th>
                `;
            });
            thead.innerHTML = headerHtml;

            tbody.innerHTML = '';
            
            const activeGroupName = state.groups[state.activeTabIndex]?.name;
            const rowsToRender = activeGroupName 
                ? state.generatedData.filter(row => row.group === activeGroupName)
                : [];

            if (rowsToRender.length === 0 && state.generatedData.length > 0) {
                tbody.innerHTML = '<tr><td colspan="100%" class="px-5 py-6 text-center text-[var(--text-muted)] italic">No data for this group. Try regenerating.</td></tr>';
                return;
            }

            rowsToRender.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = 'table-row';
                
                let rowHtml = `
                    <td class="px-5 py-2 font-medium text-[var(--text-primary)] whitespace-nowrap">${row.id}</td>
                    <td class="px-5 py-2">${row.group}</td>
                `;
                varNames.forEach(v => {
                    rowHtml += `<td class="px-5 py-2 text-[var(--accent-light)] font-mono text-right tracking-wider">${row[v]?.toFixed(3) || '0.000'}</td>`;
                });
                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });
        }

        function renderStatsVerification(varNames) {
            const tbody = document.getElementById('stats-table-body');
            tbody.innerHTML = '';

            const grouped = {};
            state.generatedData.forEach(item => {
                if (!grouped[item.group]) {
                    grouped[item.group] = {};
                    varNames.forEach(v => grouped[item.group][v] = []);
                }
                varNames.forEach(v => grouped[item.group][v].push(item[v]));
            });

            state.groups.forEach(group => {
                varNames.forEach(varName => {
                    if (!group.variables[varName]) return;
                    
                    const actualValues = grouped[group.name] ? grouped[group.name][varName] : [];
                    const actualStats = calculateActualStats(actualValues);
                    const targetMean = group.variables[varName].mean;
                    const targetSd = group.variables[varName].sd;

                    const isMeanAccurate = Math.abs(actualStats.mean - targetMean) < 0.001;
                    const isSdAccurate = Math.abs(actualStats.sd - targetSd) < 0.001;
                    const isAccurate = isMeanAccurate && isSdAccurate;

                    tbody.innerHTML += `
                        <tr class="table-row">
                            <td class="px-5 py-2.5 font-medium text-[var(--text-primary)]">${group.name}</td>
                            <td class="px-5 py-2.5">${varName}</td>
                            <td class="px-5 py-2.5 text-right font-mono text-xs">${targetMean.toFixed(2)} &plusmn; ${targetSd.toFixed(3)}</td>
                            <td class="px-5 py-2.5 font-bold font-mono text-xs text-right ${isAccurate ? 'text-green-400' : 'text-[var(--accent-light)]'}">
                                ${actualStats.mean.toFixed(3)} &plusmn; ${actualStats.sd.toFixed(3)}
                            </td>
                            <td class="px-5 py-2.5 text-center">
                                ${isAccurate 
                                    ? '<span class="material-symbols-outlined text-green-400 text-[18px]">check_circle</span>' 
                                    : '<span class="material-symbols-outlined text-[var(--accent)] text-[18px]" title="Adjustments (like clamped negatives) caused a slight shift from target">warning</span>'}
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function downloadCSV() {
            const varNames = state.groups.length > 0 ? Object.keys(state.groups[0].variables) : [];
            const headers = ["ID", "Group", ...varNames];
            const csvRows = [headers.join(",")];

            state.generatedData.forEach(row => {
                const values = [
                    row.id,
                    `"${row.group}"`,
                    ...varNames.map(v => row[v].toFixed(4))
                ];
                csvRows.push(values.join(","));
            });

            downloadFile(csvRows.join("\n"), "dataset.csv", "text/csv");
        }

        function downloadJSON() {
            const jsonStr = JSON.stringify(state.generatedData, null, 2);
            downloadFile(jsonStr, "dataset.json", "application/json");
        }

        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: `${mimeType};charset=utf-8;` });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            link.style.display = "none";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initialize
        renderConfig();

    </script>
</body>
</html>
